[defaults]
inventory            = inventory.ini
remote_user          = ubuntu
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
stdout_callback      = yaml
timeout              = 30

# The private key is injected by Jenkins via withCredentials and passed with
# --private-key. It is deliberately not referenced here, so no key path or
# filename ever lands in the repository.

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
